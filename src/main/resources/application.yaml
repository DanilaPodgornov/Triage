# noinspection YAMLSchemaValidation
spring:
  application:
    name: triage
  thymeleaf:
    cache: false
  config:
    import: optional:file:./secrets.yaml

zephyr:
  api-url: https://api.zephyrscale.smartbear.com/v2
  api-token: ${ZEPHYR_API_TOKEN:}
  page-size: 10
  projects:
    B2C: SQM
    B2B: SB2B

llm:
  base-url: http://localhost:11434
  model: qwen2.5:3b
  num-ctx: 8192
  default-prompt-location: classpath:llm/default-prioritization-prompt.txt

jira:
  api-url: ${JIRA_API_URL:}
  email: ${JIRA_EMAIL:}
  api-token: ${JIRA_API_TOKEN:}

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.qligent.triage.prioritization: INFO
    com.qligent.triage.llm.LlmClient: INFO

triage:
  llm-artifacts-dir: ./llm
  suggested-cycles-dir: ./suggested_test_cycles
  theme:
    default-theme: system
  locale:
    default-locale: en
