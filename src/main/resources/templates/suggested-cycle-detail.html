<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::main-content}, ${cycle.suggestedTestCycleName}, false, ~{::head-extra})}">
<th:block th:fragment="head-extra">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;family=Roboto+Mono:wght@400&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block">
</th:block>
<th:block th:fragment="main-content">
    <section class="tab-content" id="suggested-cycle-detail-app"
             th:attr="data-cycle-key=${cycle.suggestedTestCycleKey},
                      data-project=${project},
                      data-status=${cycle.suggestedTestCycleStatus},
                      data-sort-field=${cycle.sortField},
                      data-sort-direction=${cycle.sortDirection}">
        <div class="cycle-header">
            <p class="cycle-meta"><strong>Key:</strong> <span th:text="${cycle.suggestedTestCycleKey}"></span></p>
            <p class="cycle-meta"><strong>Status:</strong> <span id="cycle-status" th:text="${cycle.suggestedTestCycleStatus}"></span></p>
            <p class="cycle-meta"><strong>Artifact folder:</strong> <span th:text="${cycle.artifactFolder}"></span></p>
        </div>

        <div class="actions cycle-actions">
            <button type="button" id="save-sort-btn" class="btn btn-secondary" disabled data-i18n="suggested.save">Save</button>
            <button type="button" id="send-zephyr-btn" class="btn btn-primary"
                    th:disabled="${cycle.suggestedTestCycleStatus == 'Sent'}" data-i18n="suggested.send">Send to Zephyr</button>
            <a th:href="@{/suggestedcycles(project=${project})}" class="btn btn-link" data-i18n="suggested.back">Back to list</a>
        </div>

        <div class="table-scroll" id="suggested-cycle-table-scroll">
            <table class="data-table" id="suggested-cycle-table">
                <thead>
                <tr>
                    <th class="sortable-col col-key" data-sort-field="key">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.key">Key</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-name" data-sort-field="name">
                        <span class="sort-header sort-header--left">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.name">Name</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-mono" data-sort-field="aiSort">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.aiSort">AI sort</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-mono" data-sort-field="priority">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.weightPriority">Priority</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-mono" data-sort-field="status">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.weightStatus">Status</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-mono" data-sort-field="labels">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.weightLabels">Labels</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-mono" data-sort-field="executionsCount">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.weightExecutions">Executions</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-mono" data-sort-field="failuresCount">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.weightFailures">Failures</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-mono" data-sort-field="failedExecutionsRatio">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.weightFailedRatio">Fail rate</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-mono" data-sort-field="lastExecutionStatus">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.weightLastStatus">Last status</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                    <th class="sortable-col col-mono" data-sort-field="executionTime">
                        <span class="sort-header">
                            <span class="sort-header__label-wrap">
                                <span class="sort-header__label" data-i18n="suggested.col.weightExecutionTime">Exec time</span>
                                <span class="sort-header__badge material-symbols-outlined" aria-hidden="true"></span>
                            </span>
                        </span>
                    </th>
                </tr>
                </thead>
                <tbody id="suggested-cycle-table-body">
                </tbody>
            </table>
        </div>

        <script type="application/json" id="suggested-cycle-tests-json" th:utext="${testsJson}"></script>
    </section>
    <script th:src="@{/js/suggested-cycle-detail.js}" defer></script>
</th:block>
</html>
