<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::main-content}, null, true)}">
<th:block th:fragment="main-content">
    <div class="testcases-page" id="testcases-app" th:attr="data-project=${project}">
        <header class="testcases-page__header">
            <div class="actions">
                <button type="button" id="select-all-btn" class="btn btn-secondary"
                        th:disabled="${#lists.isEmpty(pageView.allMatchingTestCaseKeys)}"
                        data-i18n="testcases.selectAll">Select All</button>
                <button type="button" id="prioritize-btn" class="btn btn-primary" disabled
                        data-i18n="testcases.prioritize">Prioritize</button>
                <span id="selection-count" class="selection-count"></span>
            </div>
        </header>

        <main class="testcases-page__main">
            <div class="testcases-page__list">
                <div class="testcases-table-scroll" id="testcases-table-scroll">
                    <table class="data-table" id="testcases-table">
                        <thead>
                        <tr>
                            <th class="col-checkbox" data-column="select"></th>
                            <th class="col-key" data-column="key" data-i18n="testcases.col.key">Key</th>
                            <th class="col-priority" data-column="priority" data-i18n="testcases.col.priority">Priority</th>
                            <th class="col-status" data-column="status" data-i18n="testcases.col.status">Status</th>
                            <th class="col-folder" data-column="folder" data-i18n="testcases.col.folder">Folder</th>
                            <th class="col-name" data-column="name" data-i18n="testcases.col.name">Name</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(pageView.testCases)}">
                            <td colspan="6" class="empty-row" data-i18n="testcases.empty">No test cases found.</td>
                        </tr>
                        <tr th:each="testCase : ${pageView.testCases}">
                            <td class="col-checkbox" data-column="select">
                                <input type="checkbox" class="testcase-checkbox" th:id="'tc-' + ${testCase.key}"
                                       th:value="${testCase.key}">
                                <label class="sr-only" th:for="'tc-' + ${testCase.key}"
                                       th:text="'Select test case ' + ${testCase.key}">Select test case</label>
                            </td>
                            <td class="col-key" data-column="key" th:text="${testCase.key}"></td>
                            <td class="col-priority" data-column="priority">
                                <span th:if="${testCase.priorityColor != null}"
                                      class="priority-badge"
                                      th:style="|background-color: ${testCase.priorityColor}; color: ${testCase.priorityTextColor};|"
                                      th:text="${testCase.priority}">—</span>
                                <span th:if="${testCase.priorityColor == null}" th:text="${testCase.priority}">—</span>
                            </td>
                            <td class="col-status" data-column="status" th:text="${testCase.status}"></td>
                            <td class="col-folder" data-column="folder" th:text="${testCase.folder}"></td>
                            <td class="col-name" data-column="name" th:text="${testCase.name}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <nav class="pagination" th:if="${pageView.totalItems > 0}" aria-label="Test cases pagination">
                    <a th:if="${pageView.currentPage > 0}"
                       th:href="@{/testcases(project=${project}, priority=${pageView.selectedPriorityId}, folder=${pageView.selectedFolderId}, status=${pageView.selectedStatusId}, sort=${pageView.sort.name().toLowerCase()}, dir=${pageView.sortDirection.name().toLowerCase()}, page=${pageView.currentPage - 1})}"
                       class="pagination-link" data-i18n="testcases.pagination.previous">Previous</a>

                    <span class="pagination-info"
                          data-i18n="testcases.pagination.info"
                          th:attr="data-i18n-current=${pageView.currentPage + 1}, data-i18n-total=${pageView.totalPages}, data-i18n-items=${pageView.totalItems}">
                    </span>

                    <a th:if="${!pageView.lastPage}"
                       th:href="@{/testcases(project=${project}, priority=${pageView.selectedPriorityId}, folder=${pageView.selectedFolderId}, status=${pageView.selectedStatusId}, sort=${pageView.sort.name().toLowerCase()}, dir=${pageView.sortDirection.name().toLowerCase()}, page=${pageView.currentPage + 1})}"
                       class="pagination-link" data-i18n="testcases.pagination.next">Next</a>
                </nav>
            </div>

            <aside class="testcases-page__sidebar">
                <section class="testcases-page__columns" aria-labelledby="testcases-columns-heading">
                    <h2 id="testcases-columns-heading" class="testcases-panel__title" data-i18n="testcases.columns">Columns</h2>
                    <div class="column-toggles" id="column-toggles">
                        <label class="column-toggle">
                            <input type="checkbox" data-column-toggle="key" checked>
                            <span data-i18n="testcases.col.key">Key</span>
                        </label>
                        <label class="column-toggle">
                            <input type="checkbox" data-column-toggle="priority" checked>
                            <span data-i18n="testcases.col.priority">Priority</span>
                        </label>
                        <label class="column-toggle">
                            <input type="checkbox" data-column-toggle="status" checked>
                            <span data-i18n="testcases.col.status">Status</span>
                        </label>
                        <label class="column-toggle">
                            <input type="checkbox" data-column-toggle="folder" checked>
                            <span data-i18n="testcases.col.folder">Folder</span>
                        </label>
                        <label class="column-toggle">
                            <input type="checkbox" data-column-toggle="name" checked>
                            <span data-i18n="testcases.col.name">Name</span>
                        </label>
                    </div>
                </section>

                <section class="testcases-page__filters" aria-labelledby="testcases-filters-heading">
                    <h2 id="testcases-filters-heading" class="testcases-panel__title" data-i18n="testcases.filters">Filters</h2>
                    <form class="local-filters local-filters--stacked" method="get" th:action="@{/testcases}">
                        <input type="hidden" name="project" th:value="${project}">
                        <input type="hidden" name="page" value="0">

                        <label for="priority-filter" data-i18n="testcases.filter.priority">Priority</label>
                        <select id="priority-filter" name="priority" onchange="this.form.submit()">
                            <option value="" data-i18n="testcases.filter.allPriorities">All priorities</option>
                            <option th:each="option : ${pageView.priorities}"
                                    th:value="${option.id}"
                                    th:text="${option.name}"
                                    th:selected="${pageView.selectedPriorityId != null and pageView.selectedPriorityId == option.id}">
                            </option>
                        </select>

                        <label for="folder-filter" data-i18n="testcases.filter.folder">Folder</label>
                        <select id="folder-filter" name="folder" onchange="this.form.submit()">
                            <option value="" data-i18n="testcases.filter.allFolders">All folders</option>
                            <option th:each="option : ${pageView.folders}"
                                    th:value="${option.id}"
                                    th:text="${option.name}"
                                    th:selected="${pageView.selectedFolderId != null and pageView.selectedFolderId == option.id}">
                            </option>
                        </select>

                        <label for="status-filter" data-i18n="testcases.filter.status">Status</label>
                        <select id="status-filter" name="status" onchange="this.form.submit()">
                            <option value="" data-i18n="testcases.filter.allStatuses">All statuses</option>
                            <option th:each="option : ${pageView.statuses}"
                                    th:value="${option.id}"
                                    th:text="${option.name}"
                                    th:selected="${pageView.selectedStatusId != null and pageView.selectedStatusId == option.id}">
                            </option>
                        </select>

                        <label for="sort-filter" data-i18n="testcases.filter.sortBy">Sort by</label>
                        <select id="sort-filter" name="sort" onchange="this.form.submit()">
                            <option value="key" th:selected="${pageView.sort.name() == 'KEY'}" data-i18n="testcases.sort.key">Key</option>
                            <option value="priority" th:selected="${pageView.sort.name() == 'PRIORITY'}" data-i18n="testcases.sort.priority">Priority</option>
                            <option value="folder" th:selected="${pageView.sort.name() == 'FOLDER'}" data-i18n="testcases.sort.folder">Folder</option>
                            <option value="status" th:selected="${pageView.sort.name() == 'STATUS'}" data-i18n="testcases.sort.status">Status</option>
                        </select>

                        <label for="dir-filter" data-i18n="testcases.filter.order">Order</label>
                        <select id="dir-filter" name="dir" onchange="this.form.submit()">
                            <option value="asc" th:selected="${pageView.sortDirection.name() == 'ASC'}" data-i18n="testcases.sort.asc">Ascending</option>
                            <option value="desc" th:selected="${pageView.sortDirection.name() == 'DESC'}" data-i18n="testcases.sort.desc">Descending</option>
                        </select>
                    </form>
                </section>

                <section class="testcases-page__llm" aria-labelledby="testcases-llm-heading">
                    <h2 id="testcases-llm-heading" class="testcases-panel__title" data-i18n="testcases.llm">Local LLM</h2>
                    <label for="llm-query" data-i18n="testcases.llmQuery">Query</label>
                    <textarea id="llm-query" class="llm-query-field" rows="8"
                              data-i18n-placeholder="testcases.llmPlaceholder"
                              placeholder="Ask the local model about selected test cases…"
                              aria-disabled="true" tabindex="-1"></textarea>
                    <p class="field-hint" data-i18n="testcases.llmHint">Not connected yet — coming in a later release.</p>
                </section>
            </aside>
        </main>
    </div>

    <script th:inline="javascript">
        window.__allMatchingTestCaseKeys = /*[[${pageView.allMatchingTestCaseKeys}]]*/ [];
    </script>
</th:block>
</html>
