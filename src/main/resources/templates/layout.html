<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (content, pageTitle, includeTestCasesJs, headExtras)"
      th:attr="data-default-theme=${defaultTheme}, data-default-locale=${defaultLocale}">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <title th:text="${pageTitle != null ? pageTitle + ' — Triage' : 'Triage'}">Triage</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <script th:src="@{/js/theme-init.js}"></script>
    <script th:src="@{/js/locale-init.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <th:block th:replace="${headExtras}"></th:block>
    <script th:src="@{/js/i18n.js}" defer></script>
    <script th:src="@{/js/theme.js}" defer></script>
    <script th:if="${includeTestCasesJs}" th:src="@{/js/llm-prompt.js}" defer></script>
    <script th:if="${includeTestCasesJs}" th:src="@{/js/testcases.js}" defer></script>
</head>
<body>
<header class="app-header">
    <div class="container">
        <h1 class="app-brand">
            <img class="app-brand__icon" th:src="@{/icons/triage-mark.svg}" width="28" height="28" alt="">
            <span class="app-brand__name">Triage</span>
        </h1>
    </div>
</header>

<nav th:replace="~{fragments/tabs :: tabs}"></nav>

<section th:replace="~{fragments/global-filters :: filters}"></section>

<main class="app-main">
    <div class="container">
        <div th:if="${error}" class="error-banner" th:text="${error}"></div>
        <th:block th:replace="${content}"></th:block>
    </div>
</main>
</body>
</html>
