<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (content, pageTitle, includeTestCasesJs)"
      th:attr="data-default-theme=${defaultTheme}">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <title th:text="${pageTitle != null ? pageTitle + ' — Triage' : 'Triage'}">Triage</title>
    <script th:src="@{/js/theme-init.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}" defer></script>
    <script th:if="${includeTestCasesJs}" th:src="@{/js/testcases.js}" defer></script>
</head>
<body th:classappend="${activeTab == 'testcases'} ? 'page-testcases' : ''">
<header class="app-header">
    <h1>Triage</h1>
</header>

<nav class="app-nav" th:replace="~{fragments/tabs :: tabs}"></nav>

<section class="app-section" th:replace="~{fragments/global-filters :: filters}"></section>

<main class="app-main">
    <div th:if="${error}" class="error-banner" th:text="${error}"></div>
    <th:block th:replace="${content}"></th:block>
</main>
</body>
</html>
